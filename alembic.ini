# Alembic configuration. The database URL is NOT stored here - env.py reads it from
# rs_core settings (pydantic-settings / RS_DATABASE_URL) so there is one source of truth and
# no secret in a tracked file (CLAUDE.md invariant 8).
[alembic]
script_location = alembic
prepend_sys_path = . packages
path_separator = space

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
