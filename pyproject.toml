[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-sense"
version = "0.1.0"
description = "Internal satellite agricultural intelligence platform (Sentinel-2/CDSE). Backbone behind the AgriTrack farmer app."
requires-python = ">=3.11"
authors = [{ name = "Mishael" }]

# Base: enough to boot the API/worker, exercise the mock imagery adapter, and run Phase 1
# ingestion (PostGIS data model + geometry validation). shapely + pyproj are pure-wheel and
# carry the CRS/validation math; the heavy raster libs (rasterio/rio-tiler) stay in the `geo`
# extra, pulled in only when the windowed_cog adapter and analysis engine land (Phase 2+).
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "numpy>=1.26",
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "tenacity>=8.4",
    # Data layer (Phase 1): PostGIS-backed farm/field/analysis model.
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # Geometry validation + CRS math (Phase 1). Pure wheels, no compiler.
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
# Heavy raster stack (Phase 2+). Needs a C/C++ toolchain for some transitive wheels.
geo = [
    "rasterio>=1.3",
    "rio-tiler>=6.4",
    "geopandas>=0.14",
    "pystac-client>=0.7",
]
# Object store for derived COG previews: the worker writes via boto3, the tiler reads via GDAL.
storage = [
    "boto3>=1.34",
]
resilience = [
    "pybreaker>=1.2",
    "authlib>=1.3",
    "aiolimiter>=1.1",
]
interpret = [
    "anthropic>=0.34",
]
observability = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-celery>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "packages"]
