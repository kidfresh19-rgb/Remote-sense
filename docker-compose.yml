# remote-sense local stack. `docker compose up` brings infra + app up healthy.
# Infra (postgres/redis/minio) runs standalone before app code is complete.
name: remote-sense

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rs
      POSTGRES_PASSWORD: rs
      POSTGRES_DB: remote_sense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rs -d remote_sense"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # Host ports are for dev access only; containers reach MinIO at minio:9000 over the compose
    # network. start.py relocates these off the default when Windows (Hyper-V/WinNAT) has reserved
    # the 9000-9034 block, the cause of the "ports are not available ... forbidden by its access
    # permissions" bind failure. Override with RS_MINIO_API_PORT / RS_MINIO_CONSOLE_PORT.
    ports:
      - "${RS_MINIO_API_PORT:-9000}:9000"
      - "${RS_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/remote-sense;
      exit 0;
      "

  # One-shot schema migration. Runs to completion before the app services start, so the
  # PostGIS data model (Phase 1) is in place. Keeps migrations out of app startup (safe with
  # multiple replicas).
  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot Natural Region seed (PRD 0002 slice 1), after the schema is in place. Built with the
  # geo extra (geopandas reads the boundary file) and runs to completion; idempotent, so a restart
  # re-runs harmlessly. The seed file is committed reference geometry under data/natural_regions/,
  # mounted read-only rather than baked into every image. App services depend on migrate, not seed,
  # so seeding never blocks boot.
  seed:
    build:
      context: .
      args:
        INSTALL_EXTRAS: "[geo]"
    command: python -m rs_core.seed_regions
    env_file: .env
    volumes:
      - ./data/natural_regions:/app/data/natural_regions:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - tiler

  api:
    build: .
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    # geo (rasterio: write_cog) + storage (boto3: S3 COG store) so the pipeline emits index COGs
    # to MinIO for the tiler. Without these, cog_store_from_settings is a no-op and tiles 404.
    build:
      context: .
      args:
        INSTALL_EXTRAS: "[geo,storage]"
    # S4.2: the pool autoscales between min and max processes with queue depth (max,min - sized
    # per host via RS_WORKER_AUTOSCALE in .env). Horizontal scale-out is
    # `docker compose up -d --scale worker=N`: enqueue-time dedup/locking (R-1) keeps concurrent
    # workers from double-processing a scene, and migrations stay in the one-shot migrate service.
    command: celery -A services.worker.celery_app.celery worker -l info --autoscale=${RS_WORKER_AUTOSCALE:-4,1}
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    build: .
    command: celery -A services.worker.celery_app.celery beat -l info
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Map tiles (L5). Built with the geo extra (rasterio/rio-tiler) so it renders in-container;
  # reads index COGs from MinIO over GDAL's /vsis3/ driver, so it needs no DB, only minio.
  tiler:
    build:
      context: .
      args:
        INSTALL_EXTRAS: "[geo]"
    command: uvicorn services.tiler.main:app --host 0.0.0.0 --port 8001 --reload
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
