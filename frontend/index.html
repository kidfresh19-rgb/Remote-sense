<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>remote-sense workspace</title>
    <script>
      // Resolve the theme before first paint so there is no flash. Default to the OS preference,
      // honour an explicit choice if the analyst has set one.
      (function () {
        try {
          var stored = localStorage.getItem("rs-theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode or storage disabled: fall back to the CSS default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
