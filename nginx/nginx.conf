events {}

http {
    # Docker's embedded DNS. nginx resolves an upstream host once at config load and caches that
    # IP for the worker's life; when a service container is recreated it gets a new bridge IP and
    # nginx keeps dialing the dead one (502, "connect() failed (111: Connection refused)"). Pairing
    # this resolver with a *variable* in proxy_pass (below) forces re-resolution per request, honoring
    # valid=10s, so a restarted api/tiler is picked up in seconds without restarting nginx. A static
    # `upstream { server api:8000; }` block cannot do this on open-source nginx, so it is gone.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # Tile traffic goes to the tiler service. The variable defers DNS to request time.
        location /tiles/ {
            set $tiler_upstream tiler;
            proxy_pass http://$tiler_upstream:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Origin $http_origin;
        }

        # Static pass previews (Passes tab thumbnails) and raw COG exports are tiler routes too;
        # without these the requests fall through to the API catch-all below and 404, which is why
        # the pass thumbnails never load. Same variable-upstream trick as /tiles/ for live DNS.
        location /static/ {
            set $tiler_upstream tiler;
            proxy_pass http://$tiler_upstream:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Origin $http_origin;
        }

        location /export/ {
            set $tiler_upstream tiler;
            proxy_pass http://$tiler_upstream:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Origin $http_origin;
        }

        # Health check forwarded to the tiler directly
        location /tiler/healthz {
            set $tiler_upstream tiler;
            proxy_pass http://$tiler_upstream:8001/healthz;
            proxy_set_header Host $host;
        }

        # Everything else goes to the API
        location / {
            set $api_upstream api;
            # Pass through all request headers for CORS preflight and normal requests
            proxy_pass http://$api_upstream:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Support uvicorn's websocket reload in dev
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
