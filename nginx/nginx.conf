events {}

http {
    upstream api {
        server api:8000;
    }

    upstream tiler {
        server tiler:8001;
    }

    server {
        listen 80;

        # Tile traffic goes to the tiler service
        location /tiles/ {
            proxy_pass http://tiler;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Origin $http_origin;
        }

        # Health check forwarded to the tiler directly
        location /tiler/healthz {
            proxy_pass http://tiler/healthz;
            proxy_set_header Host $host;
        }

        # Everything else goes to the API
        location / {
            # Pass through all request headers for CORS preflight and normal requests
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Support uvicorn's websocket reload in dev
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
